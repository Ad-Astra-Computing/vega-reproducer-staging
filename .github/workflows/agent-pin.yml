# Keep the pinned vega-agent current.
#
# reproduce.yml checks the agent out by the commit SHA in agent.pin, which is
# deliberate: this lane gates the master signing key, so what it runs must be an
# exact reviewed commit rather than a tag someone can move. The cost is that
# nothing watches it. Dependabot reads `uses:` and cannot see a checked-out
# commit, so the pin sat five releases behind for a month and the reproductions
# that failed on it looked like ordinary build failures.
#
# This opens a pull request when vega-agent publishes a newer release. A pull
# request rather than a push, because the point of the SHA is that a human
# looked at it, and because a scheduled job that merely FAILS is something
# nobody sees: that is how the pin got stale in the first place.
name: Agent pin

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open a pull request when the pin is behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' agent.pin)
          tag=$(gh release view --repo Ad-Astra-Computing/vega-agent --json tagName --jq .tagName)
          # Dereference: an annotated tag's ref points at the tag object, not the commit.
          want=$(gh api "repos/Ad-Astra-Computing/vega-agent/git/ref/tags/$tag" --jq '.object.sha')
          kind=$(gh api "repos/Ad-Astra-Computing/vega-agent/git/ref/tags/$tag" --jq '.object.type')
          if [ "$kind" = tag ]; then
            want=$(gh api "repos/Ad-Astra-Computing/vega-agent/git/tags/$want" --jq '.object.sha')
          fi
          if [ "$current" = "$want" ]; then
            echo "pin is current: $tag ($current)"
            exit 0
          fi
          echo "pin $current is behind $tag ($want)"
          branch="agent-pin-$tag"
          # Commit through the contents API rather than with git. main requires
          # signed commits, and a commit pushed by the runner is unsigned, so the
          # pull request could never merge. GitHub signs what the API writes.
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$branch" -f "sha=$base" >/dev/null 2>&1 \
            || gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
                 -f "sha=$base" -F force=true >/dev/null
          blob=$(gh api "repos/$GITHUB_REPOSITORY/contents/agent.pin?ref=$branch" --jq '.sha')
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/agent.pin" \
            -f "message=pin the reproducer to vega-agent $tag" \
            -f "content=$(printf '%s # %s\n' "$want" "$tag" | base64 -w0)" \
            -f "branch=$branch" -f "sha=$blob" --jq '.commit.sha' >/dev/null
          # Reuse an open PR for this tag rather than stacking one per run.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "Pin the reproducer to vega-agent $tag" \
              --body "vega-agent released $tag. This lane gates the master signing key, so read the agent diff before merging: https://github.com/Ad-Astra-Computing/vega-agent/compare/$current...$want"
          fi
