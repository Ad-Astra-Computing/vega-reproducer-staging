# Vega reproducer (staging). Rebuilds a build from its provenance on a fresh
# GitHub runner under this repo's OIDC identity and attests the result to the
# staging control plane, feeding the vega-repro lane. Triggered by the Vega
# control plane via workflow_dispatch. For macOS reproduction set runner: macos-latest.
name: Reproduce
on:
  workflow_dispatch:
    inputs:
      flake_ref: { description: "Flake reference", required: true }
      attr: { description: "Attribute path", required: true }
      rev: { description: "Locked revision", required: true }
      dir: { description: "Subflake directory (optional)", required: false, default: "" }
      expect_store_path: { description: "Expected store path (optional)", required: false, default: "" }
      expect_narhash: { description: "Expected narHash (optional)", required: false, default: "" }
      # The candidate this job is for. Optional, so a hand-run reproduction still
      # works, and so the control plane can start sending it without this repo
      # having to change first. Without it a build that can never resolve (an
      # attribute the flake does not provide) is re-dispatched for ever, because
      # nothing can record the failure against the candidate that caused it.
      hash: { description: "Candidate store-path hash (optional)", required: false, default: "" }
      runner:
        description: "Runner to reproduce on"
        required: false
        default: "ubuntu-latest"
        type: choice
        options: ["ubuntu-latest", "ubuntu-22.04", "macos-latest", "macos-14"]
permissions:
  id-token: write # GitHub Actions OIDC, so Vega can verify the runner identity
  contents: read
# Serialize duplicate reproductions of the same target; do not cancel an in-flight one.
concurrency:
  group: reproduce-${{ inputs.flake_ref }}-${{ inputs.dir }}-${{ inputs.attr }}-${{ inputs.rev }}-${{ inputs.runner }}
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Constrain runner
        # Fail closed unless the label is a known GitHub-hosted ephemeral runner, so
        # a reproduction that gates the signing key cannot be steered onto
        # operator-chosen hardware. Passed via env, never inlined: no shell injection.
        env:
          RUNNER_INPUT: ${{ inputs.runner }}
        run: |
          case "$RUNNER_INPUT" in
            ubuntu-latest|ubuntu-24.04|ubuntu-22.04|macos-latest|macos-15|macos-14|macos-13) ;;
            *) echo "refusing to reproduce on non-allowlisted runner '$RUNNER_INPUT'" >&2; exit 1 ;;
          esac
      # Check out the agent code (pinned), not this repo; this repo holds only the
      # workflow. persist-credentials:false so no token is left on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ad-Astra-Computing/vega-agent
          ref: fc8fe29c4931896322991f8b88dd738263a58744 # v0.18.0
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # Pin the Nix release the installer fetches, so this signing-gate lane
          # cannot be shifted by a change to the installer's default version.
          source-tag: v3.21.0
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = true
            # A build that cannot be sandboxed must fail, not run unsandboxed. Nix's
            # default sandbox-fallback would silently drop isolation if sandbox setup
            # failed, and this reproducer builds attacker-chosen flake refs whose byte
            # agreement gates the master signing key.
            sandbox-fallback = false
            # Native builds only: do not register emulated platforms (e.g. Rosetta
            # x86_64-darwin on an arm64 macOS runner). A wrong-arch reproduction
            # must fail rather than complete under emulation, where differing bytes
            # for the same store path could forge a divergence on a signed output.
            extra-platforms =
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install agent deps
        run: npm ci
      - name: Reproduce and attest
        env:
          # Hardcoded (not an input) so the OIDC token only ever reaches Vega.
          # This reproducer attests to staging; the production reproducer points
          # at https://vega-cache.dev.
          VEGA_URL: "https://vega-cache-staging.ad-astra-computing-inc.workers.dev"
          VEGA_FLAKE_REF: ${{ inputs.flake_ref }}
          VEGA_ATTR: ${{ inputs.attr }}
          VEGA_REV: ${{ inputs.rev }}
          VEGA_DIR: ${{ inputs.dir }}
          VEGA_EXPECT_STORE_PATH: ${{ inputs.expect_store_path }}
          VEGA_EXPECT_NARHASH: ${{ inputs.expect_narhash }}
          VEGA_HASH: ${{ inputs.hash }}
        run: node_modules/.bin/tsx agent/reproduce.ts
